<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ألعاب بينا 🎲</title>
<meta name="description" content="أربع ألعاب بسيطة بين اتنين: أسئلة، واختيارات، وتخمين. العبوا على نفس الموبايل أو من مكانين.">
<meta name="theme-color" content="#3b5bfd">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ألعاب بينا">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700&display=swap"></noscript>
<style>
:root{--ink:#14143a;--card:#fffdf5;--yel:#ffd93d;--pink:#ff6fb1;--grn:#2fd18b;--sky:#6ee7ff}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:radial-gradient(rgba(255,255,255,.14) 2px,transparent 2px) 0 0/26px 26px,#3b5bfd;color:#fff;font-family:Tajawal,system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:calc(22px + env(safe-area-inset-top,0px)) 14px calc(30px + env(safe-area-inset-bottom,0px))}
main{width:100%;max-width:420px;text-align:center}
h1{font:400 32px Lalezar,Tajawal,sans-serif;text-shadow:3px 3px 0 var(--ink)}
p.t{font-weight:700;font-size:14px;margin:4px 0 14px;line-height:1.7;opacity:.95}
.g{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);text-align:start;margin-top:12px;padding:10px 12px;background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.g:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.g:focus-visible{outline:4px solid #fff;outline-offset:3px}
.ic{flex:none;width:62px;height:62px;display:grid;place-items:center;font-size:32px;border:3px solid var(--ink);border-radius:18px}
.c0{background:var(--yel)}.c1{background:var(--pink)}.c2{background:var(--grn)}.c3{background:var(--sky)}.c4{background:#ff9f43}
.tx{flex:1;min-width:0}
.tx b{display:block;font:400 22px Lalezar,Tajawal,sans-serif;line-height:1.3}
.tx span{display:block;font-weight:700;font-size:13.5px;line-height:1.5;opacity:.8}
.ar{flex:none;font:700 22px Tajawal,sans-serif;opacity:.5}
.inst{margin-top:18px;font:700 14px Tajawal,sans-serif;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:99px;padding:6px 16px;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.hint{margin-top:16px;font-weight:700;font-size:13px;line-height:1.8}
</style>
</head>
<body>
<main>
  <h1>ألعاب بينا 🎲</h1>
  <p class="t">اختار لعبتك. كلها بين اتنين، على نفس الموبايل أو من مكانين.</p>
  <div id="games"></div>
  <button class="inst" id="inst" hidden>📲 ثبّت الصفحة دي</button>
  <p class="hint" id="ios" hidden>للتثبيت على الآيفون: زرار المشاركة ثم «إضافة إلى الشاشة الرئيسية»</p>
</main>
<script>
/* The four games. To change a link or a line, edit it here. */
const GAMES=[
  {icon:'💬',name:'كروت بينا',desc:'أسئلة وتحديات تقرّبكم',url:'https://benacards-two.vercel.app/'},
  {icon:'🤔',name:'تفضّل إيه؟',desc:'اختاروا ونشوف توافقكم',url:'https://wyr-game-orpin.vercel.app/'},
  {icon:'👀',name:'مين فينا؟',desc:'مين فينا أكتر واحد؟',url:'https://who-game-seven.vercel.app/'},
  {icon:'🔮',name:'خمّن إجابتي',desc:'مين عارف التاني أكتر؟',url:'https://guess-game-one-rho.vercel.app/'},
  {icon:'🪙',name:'قول أو اعمل',desc:'اقلب العملة: قول ولا اعمل؟',url:'https://qoul-or-e3mel-ift1.vercel.app/'}
];
document.getElementById('games').innerHTML=GAMES.map((g,i)=>`<a class="g" href="${g.url}" rel="noopener"><span class="ic c${i}">${g.icon}</span><span class="tx"><b>${g.name}</b><span>${g.desc}</span></span><span class="ar">‹</span></a>`).join('');
/* install */
let DP=null;const inst=document.getElementById('inst');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;inst.hidden=false});
inst.addEventListener('click',()=>{if(DP){DP.prompt();DP.userChoice.finally(()=>{DP=null;inst.hidden=true})}});
if(/iphone|ipad|ipod/i.test(navigator.userAgent||'')&&!navigator.standalone)document.getElementById('ios').hidden=false;
try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
</body>
</html>
